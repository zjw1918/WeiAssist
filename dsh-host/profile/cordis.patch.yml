# WeiAssist's dsh profile patch (dsh 0.2.2-rc.1: dsh --profile weiassist, created from the shipped headless template).
# dsh runs as one of the app's AI cores: the bridge plugin connects to the app and runs its sessions.
# Sessions keep dsh's own capabilities (its tools, subagents, web, todo, plan mode, skills) and get the app's
# tools (its catalog) on top; the bridge gates every call through the app.

# No one-shot task: the bridge keeps the process alive while the app is connected. headless-startup requires a
# task (without one it fails and takes dsh's app context down), so it is off too, and the sandbox policy gets its
# options here instead: the session folders are its writable workspace.
- id: headless-runner
  disabled: true
- id: headless-startup
  disabled: true
- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.WEIASSIST_SESSIONS_DIR ?? process.cwd()

# Model routes. With the app, they go through its key proxy (WEIASSIST_PROXY_URL/<route>), which puts the real key
# in: dsh's "key" (WEIASSIST_KEY_<ROUTE>) is only the proxy's token. dsh never holds a model key.
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: WEIASSIST_KEY_OPENAI
        baseURL: !!js "process.env.WEIASSIST_PROXY_URL ? process.env.WEIASSIST_PROXY_URL + '/openai' : 'https://api.openai.com/v1'"
      deepseek:
        apiKeyEnv: WEIASSIST_KEY_DEEPSEEK
        baseURL: !!js "process.env.WEIASSIST_PROXY_URL ? process.env.WEIASSIST_PROXY_URL + '/deepseek' : 'https://api.deepseek.com'"
      # The app's dev mock server (tools/mock-openai.mjs, adb reverse tcp:8787).
      mock:
        displayName: WeiAssist mock
        apiKeyEnv: WEIASSIST_KEY_MOCK
        api: openai-responses
        baseURL: !!js "process.env.WEIASSIST_PROXY_URL ? process.env.WEIASSIST_PROXY_URL + '/mock' : (process.env.WEIASSIST_MOCK_URL ?? 'http://127.0.0.1:8787/v1')"
        models:
          - id: gpt-6.1-terra
            name: Mock
            contextWindow: 128000
            # Phone tasks send screenshots: without this dsh keeps images from the model.
            input: [text, image]

# The app titles its sessions itself; dsh's titler would make a model request of its own.
# dsh's persona is a coding agent's: each session's own words come from the app (the bridge's prompt section).
- id: system-prompt
  config:
    personaPrefix: ''

- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true

- insert:
    - id: weiassist-bridge
      name: '@weiassist/dsh-bridge'
