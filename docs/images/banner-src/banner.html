<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root { --bg:#0a0e16; --glow:rgba(61,134,245,.28); --title:#f4f7fb; --sub:#8f9bb0; --tag:#5aa7ff; --chip:#141a25; --chipline:#232c3b; --label:#e6ebf3; --cap:#7d8899; }
  body.light { --bg:#f6f8fb; --glow:rgba(61,134,245,.18); --title:#0d1320; --sub:#5d6778; --tag:#2f6fe0; --chip:#ffffff; --chipline:#e2e7ef; --label:#141a25; --cap:#7a8494; }
  html,body { margin:0; }
  body { width:1280px; height:400px; overflow:hidden; background:var(--bg);
    font-family:-apple-system,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; box-sizing:border-box; gap:64px; }
  .glow { position:absolute; left:calc(50% - 640px + 60px); top:-40px; width:520px; height:480px; background:radial-gradient(closest-side, var(--glow), transparent); pointer-events:none; }
  .icon { position:relative; width:264px; height:264px; flex:none; border-radius:60px; filter:drop-shadow(0 18px 40px rgba(30,90,200,.35)); }
  .icon img { width:100%; height:100%; display:block; }
  .text { position:relative; display:flex; flex-direction:column; }
  .name { display:flex; align-items:baseline; gap:22px; }
  h1 { margin:0; font-size:112px; line-height:1; font-weight:800; letter-spacing:-3px; color:var(--title); }
  .zh { font-size:44px; font-weight:500; color:var(--sub); letter-spacing:2px; }
  .tag { margin-top:20px; font-size:21px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:var(--tag); }
  .chips { margin-top:30px; display:flex; gap:14px; }
  .chip { display:flex; align-items:center; gap:12px; padding:10px 18px 10px 10px; border-radius:16px; background:var(--chip); border:1px solid var(--chipline); }
  .chip img { width:40px; height:40px; border-radius:10px; display:block; }
  .chip .pi { background:#fff; padding:7px; box-sizing:border-box; }
  body:not(.light) .chip .pi { background:#1d2430; }
  .chip b { display:block; font-size:19px; font-weight:650; color:var(--label); }
  .chip span { display:block; font-size:14px; color:var(--cap); margin-top:2px; }
</style></head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="icon"><img src="weiassist-icon.svg"></div>
  <div class="text">
    <div class="name"><h1>WeiAssist</h1><div class="zh">小维助手</div></div>
    <div class="tag" id="tag">Open-source AI agent for Android</div>
    <div class="chips">
      <div class="chip"><img class="pi" src="pi.svg"><div><b>Pi</b><span id="c1">AI engine</span></div></div>
      <div class="chip"><img id="dsh" src="dsh-favicon-dark.svg"><div><b>DeepSeek Harness</b><span id="c2">AI engine</span></div></div>
      <div class="chip"><img src="termux-icon.png"><div><b>Termux</b><span id="c3">Linux tools</span></div></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') { document.body.classList.add('light'); document.getElementById('dsh').src = 'dsh-favicon.svg'; }
  if (q.get('lang') === 'zh') {
    document.getElementById('tag').textContent = '开源的 Android AI 助手';
    document.getElementById('tag').style.letterSpacing = '4px'; document.getElementById('tag').style.textTransform = 'none';
    for (const id of ['c1','c2']) document.getElementById(id).textContent = 'AI 引擎';
    document.getElementById('c3').textContent = 'Linux 工具';
  }
</script>
</body></html>
