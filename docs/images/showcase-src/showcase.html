<!DOCTYPE html>
<!-- The README showcase: four real screenshots in phone frames, with English and Chinese captions. See README.md here. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1920px; height: 940px; overflow: hidden; background: radial-gradient(1200px 600px at 50% 0%, #131c2c, #090d15 70%);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .row { display: flex; justify-content: center; gap: 92px; padding-top: 70px; }
  .item { width: 340px; display: flex; flex-direction: column; align-items: center; }
  .phone { width: 300px; height: 652px; border-radius: 44px; background: #05070b; padding: 10px; box-sizing: content-box;
    box-shadow: 0 0 0 2px #2a3242, 0 30px 70px rgba(0,0,0,.55); position: relative; }
  .screen { width: 300px; height: 652px; border-radius: 36px; overflow: hidden; position: relative; }
  .screen img { width: 100%; height: 100%; display: block; }
  /* A clean status bar over the screenshot's (blanked) one: 125 of 2400 px. */
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px; font-size: 13px; font-weight: 600; color: #111; }
  .bar svg { display: block; }
  .icons { display: flex; gap: 5px; align-items: center; }
  h2 { margin: 34px 0 0; font-size: 27px; font-weight: 700; color: #f2f5fa; letter-spacing: -.2px; }
  .zh { margin-top: 8px; font-size: 21px; font-weight: 600; color: #4fa3ff; }
  .sub { margin-top: 10px; font-size: 16px; color: #8d98ab; text-align: center; }
</style></head>
<body>
<template id="bar">
  <div class="bar"><span>9:41</span><span class="icons">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 0.6 4.1a10.5 10.5 0 0 1 14.8 0Z" fill="#111"/></svg>
    <svg width="14" height="12" viewBox="0 0 14 12"><path d="M13 0v12H1Z" fill="#111"/></svg>
    <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="2.5" fill="none" stroke="#111"/><rect x="2" y="2" width="15" height="7" rx="1.2" fill="#111"/><rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#111"/></svg>
  </span></div>
</template>
<div class="row">
  <div class="item"><div class="phone"><div class="screen"><img src="1-subagents.png"></div></div>
    <h2>Subagents in parallel</h2><div class="zh">子智能体并行工作</div>
    <div class="sub">DeepSeek Harness runs three agents at once</div></div>
  <div class="item"><div class="phone"><div class="screen"><img src="2-answer.png"></div></div>
    <h2>One answer at the end</h2><div class="zh">最后汇总成一份答案</div>
    <div class="sub">three results → one comparison table</div></div>
  <div class="item"><div class="phone"><div class="screen"><img src="3-engine.png"></div></div>
    <h2>Choose your engine</h2><div class="zh">自选 AI 引擎</div>
    <div class="sub">Pi built in, DeepSeek Harness in Termux</div></div>
  <div class="item"><div class="phone"><div class="screen"><img src="4-pi.png"></div></div>
    <h2>Live answers with Pi</h2><div class="zh">Pi 实时查询</div>
    <div class="sub">curl in Termux → a 3-day table, 10 s</div></div>
</div>
<script>
  const bar = document.getElementById("bar");
  for (const s of document.querySelectorAll(".screen")) s.appendChild(bar.content.cloneNode(true));
</script>
</body></html>
