name: Release

# Push a version tag (git tag v0.2 && git push origin v0.2) to build a signed APK and publish it as a
# GitHub Release. Tags with a hyphen (v0.2-beta1) become pre-releases.
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds and checks a signed APK and
# keeps it as a workflow artifact, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    env:
      # The release key's SHA-256 fingerprint: the job fails if the APK is signed with anything else.
      EXPECTED_CERT: a4252ad1ebca49b6d011929fc951b0f4e6b0a59d400d831843bc516d7a8f6220
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # magpie/upstream: the AI gateway's source
      - uses: actions/setup-node@v7 # Gradle builds the Pi bundle with npm
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pi-host/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v6 # Gradle builds the AI gateway (magpie) with Go
        with:
          go-version-file: magpie/upstream/go.mod
          cache-dependency-path: magpie/upstream/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # a release must not depend on, or write to, a tag's own cache

      - name: Version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "name=0.0.0-dryrun" >> "$GITHUB_OUTPUT"; echo "code=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="${GITHUB_REF_NAME}"; name="${tag#v}"
          # v1.2.3 -> 10203; v0.2 -> 200; a pre-release suffix (-beta1) doesn't change the code.
          IFS=. read -r major minor patch <<< "${name%%-*}"
          for n in "${major}" "${minor:-0}" "${patch:-0}"; do
            [[ "${n}" =~ ^[0-9]+$ ]] || { echo "::error::Tag ${tag} is not vMAJOR.MINOR[.PATCH][-suffix]"; exit 1; }
          done
          code=$(( major * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          [[ "${name}" == *-* ]] && echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" || true
          echo "versionName ${name}, versionCode ${code}"

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.WEIASSIST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WEIASSIST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEIASSIST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WEIASSIST_KEY_PASSWORD }}
        run: |
          [ -n "${KEYSTORE_BASE64}" ] || { echo "::error::Signing secrets are missing"; exit 1; }
          dir="${RUNNER_TEMP}/signing"; mkdir -p "${dir}"; chmod 700 "${dir}"
          echo "${KEYSTORE_BASE64}" | base64 -d > "${dir}/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${dir}/release.jks" "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" > "${dir}/keystore.properties"
          echo "WEIASSIST_SIGNING=${dir}/keystore.properties" >> "$GITHUB_ENV"

      - name: Build
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Check the signature
        run: |
          set -o pipefail
          ls -l app/build/outputs/apk/release/
          apk=app/build/outputs/apk/release/app-release.apk
          bt="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "${bt}/apksigner" verify --verbose --print-certs "${apk}" 2> /dev/null | tee apksigner.txt
          cert=$(grep -i -m1 'certificate SHA-256 digest' apksigner.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "${cert}" = "${EXPECTED_CERT}" ] || { echo "::error::APK signed with ${cert:-nothing}, expected ${EXPECTED_CERT}"; exit 1; }
          cp "${apk}" "WeiAssist-${{ steps.version.outputs.name }}.apk"
          sha256sum "WeiAssist-${{ steps.version.outputs.name }}.apk" > "WeiAssist-${{ steps.version.outputs.name }}.apk.sha256"

      # WeiAssist Gateway, the optional AI gateway app (magpie), built by the same assembleRelease and signed with
      # the same key. WeiAssist itself must not carry the gateway.
      - name: Check the gateway APK
        run: |
          set -o pipefail
          unzip -l app/build/outputs/apk/release/app-release.apk > app-files.txt
          if grep -q libmagpie.so app-files.txt; then echo "::error::WeiAssist's APK has the gateway in it"; exit 1; fi
          apk=gateway/build/outputs/apk/release/gateway-release.apk
          unzip -l "${apk}" > gateway-files.txt
          grep -q 'lib/arm64-v8a/libmagpie.so' gateway-files.txt || { echo "::error::the gateway APK has no gateway"; exit 1; }
          bt="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "${bt}/apksigner" verify --print-certs "${apk}" 2> /dev/null > apksigner-gateway.txt
          cert=$(grep -i -m1 'certificate SHA-256 digest' apksigner-gateway.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "${cert}" = "${EXPECTED_CERT}" ] || { echo "::error::gateway APK signed with ${cert:-nothing}, expected ${EXPECTED_CERT}"; exit 1; }
          cp "${apk}" "Gateway-${{ steps.version.outputs.name }}.apk"
          sha256sum "Gateway-${{ steps.version.outputs.name }}.apk" > "Gateway-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Keep the dry-run APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: weiassist-release-dryrun
          path: |
            WeiAssist-*.apk*
            Gateway-*.apk*
          retention-days: 3

      - name: Remove the key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/signing"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "WeiAssist-${{ steps.version.outputs.name }}.apk"
          "WeiAssist-${{ steps.version.outputs.name }}.apk.sha256"
          "Gateway-${{ steps.version.outputs.name }}.apk"
          "Gateway-${{ steps.version.outputs.name }}.apk.sha256"
          --title "WeiAssist ${{ steps.version.outputs.name }}"
          --generate-notes --verify-tag ${{ steps.version.outputs.prerelease }}
